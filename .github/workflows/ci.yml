name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run licenses

  electron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Ubuntu 24.04+ blocks the unprivileged user namespaces Chromium's sandbox uses;
      # allow them so the smoke test runs with the sandbox on.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run ui:build
      - run: npm run ui:smoke
      - run: npm run nw -- new "$RUNNER_TEMP/world.nwsave" --seed q3Zk1d0XbAc
      - run: npm run ui:smoke -- --ui "$RUNNER_TEMP/world.nwsave" --out "$RUNNER_TEMP"
